name: Code quality

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - fix/admin-panel-shell-and-businesses
      - feat/v1-admin-content-seo

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run automated tests
        run: npm test
      - name: Run ESLint
        run: npm run lint
      - name: Verify production build
        run: npm run build
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/seo_product_ci
          JWT_SECRET: ci-only-secret-do-not-use-in-production-000000000000000000000000
          AUTH_RATE_LIMIT_SECRET: ci-only-rate-limit-secret-000000000000000000000000
          NEXT_PUBLIC_SITE_URL: https://example.invalid
